    }

/* =========================================================

========================================================= */  
  
function showMessage(  
    id,  
    text,  
    type  
) {  
  
    const element =  
        document.getElementById(id);  
  
    if (!element) {  
        return;  
    }  
  
    element.textContent =  
        text;  
  
    element.className =  
        "message show " + type;  
}  
  
  
function clearMessage(id) {  
  
    const element =  
        document.getElementById(id);  
  
    if (!element) {  
        return;  
    }  
  
    element.textContent =  
        "";  
  
    element.className =  
        "message";  
}  
  
  
function escapeHTML(value) {  
  
    return String(  
        value ?? ""  
    )  
        .replace(/&/g, "&amp;")  
        .replace(/</g, "&lt;")  
        .replace(/>/g, "&gt;")  
        .replace(/"/g, "&quot;")  
        .replace(/'/g, "&#039;");  
}  
  
  
function firebaseError(error) {  
  
    const code =  
        error?.code || "";  
  
    switch (code) {  
  
        case "auth/invalid-credential":  
            return "Email or password is incorrect.";  
  
        case "auth/invalid-login-credentials":  
            return "Email or password is incorrect.";  
  
        case "auth/user-not-found":  
            return "No account exists with this email.";  
  
        case "auth/wrong-password":  
            return "Incorrect password.";  
  
        case "auth/invalid-email":  
            return "Invalid email address.";  
  
        case "auth/network-request-failed":  
            return "Network error. Check your internet connection.";  
  
        case "auth/too-many-requests":  
            return "Too many attempts. Please wait.";  
  
        case "permission-denied":  
            return "Firebase permission denied. Check Firestore rules.";  
  
        default:  
            return error?.message ||  
                "Something went wrong.";  
    }  
}  
  
  
/* =========================================================  
   GET ADMIN PROFILE  
========================================================= */  
  
async function loadAdminProfile(user) {  
  
    const adminRef =  
        doc(  
            db,  
            ADMINS_COLLECTION,  
            user.uid  
        );  
  
    const snapshot =  
        await getDoc(adminRef);  
  
    if (!snapshot.exists()) {  
  
        throw new Error(  
            "This admin account has no company profile. Create admins/" +  
            user.uid +  
            " with a companyId field in Firestore."  
        );  
    }  
  
    const data =  
        snapshot.data();  
  
    const companyId =  
        String(  
            data.companyId ||  
            ""  
        ).trim();  
  
    if (!companyId) {  
  
        throw new Error(  
            "This admin account has no companyId."  
        );  
    }  
  
    currentCompanyId =  
        companyId;  
  
    return data;  
}

   COMPANY REFERENCE  
========================================================= */  
  
function getCompanyRef() {  
  
    if (!currentCompanyId) {  
        throw new Error(  
            "Company ID is not available."  
        );  
    }  
  
    return doc(  
        db,  
        COMPANIES_COLLECTION,  
        currentCompanyId  
    );  
}  
  
  
/* =========================================================  
   PROPERTIES REFERENCE  
========================================================= */  
  
function getPropertiesRef() {

        );  
    }  
  
    return collection(  
        db,  
        COMPANIES_COLLECTION,  
        currentCompanyId,  
        PROPERTIES_SUBCOLLECTION  
    );  
}

/* =========================================================

========================================================= */  
  
async function loadProperties() {  
  
    propertiesList.innerHTML =  
        `  
        <div class="loading">  
            Loading properties...  
        </div>  
        `;  
  
  
    try {  
  
        const snapshot =  
            await getDocs(  
                getPropertiesRef()  
            );  
  
  
        allProperties = [];  
  
  
        snapshot.forEach(  
            propertyDoc => {  
  
                allProperties.push({  
  
                    id:  
                        propertyDoc.id,  
  
                    ...propertyDoc.data()  
  
                });  
  
            }  
        );  
  
  
        updateStats();  
  
        renderProperties(  
            allProperties  
        );  
  
    }  
  
    catch (error) {  
  
        console.error(  
            "Load properties:",  
            error  
        );  
  
        propertiesList.innerHTML =  
            `  
            <div class="empty">  
                Unable to load properties.  
            </div>  
            `;  
  
        showMessage(  
            "dashboardMessage",  
            firebaseError(error),  
            "error"  
        );  
  
    }  
  
}

/* =========================================================  
   RENDER PROPERTIES  
========================================================= */  
  
function renderProperties(  
    properties  
) {  
  
    if (!properties.length) {  
  
        propertiesList.innerHTML =  
            `  
            <div class="empty">  
                No properties found.  
            </div>  
            `;  
  
        return;  
    }  
  
  
    propertiesList.innerHTML =  
        properties.map(  
            property => {  
  
                const status =  
                    String(  
                        property.status ||  
                        "available"  
                    ).toLowerCase();  
  
  
                const image =  
                    property.imageUrl ||  
                    property.image ||  
                    "";  
  
  
                const title =  
                    property.title ||  
                    "Untitled Property";  
  
  
                const location =  
                    property.location ||  
                    "Location not specified";  
  
  
                const type =  
                    property.propertyType ||  
                    property.type ||  
                    "Property";  
  
  
                const purpose =  
                    String(  
                        property.purpose ||  
                        "sale"  
                    ).toLowerCase();  
  
  
                let statusClass =  
                    "";  
  
                if (status === "sold") {  
  
                    statusClass =  
                        "sold";  
                }  
  
                if (status === "rented") {  
  
                    statusClass =  
                        "rented";  
                }  
  
  
                return `  
  
                <article class="property">  
  
                    <div class="property-top">  
  
                        <div class="property-image">  
  
                            ${  
                                image  
                                ?  
                                `  
                                <img  
                                    src="${escapeHTML(image)}"  
                                    alt="${escapeHTML(title)}"  
                                    onerror="this.style.display='none'"  
                                >  
                                `  
                                :  
                                `  
                                <div  
                                    style="  
                                        width:100%;  
                                        height:100%;  
                                        display:grid;  
                                        place-items:center;  
                                        color:#94a3b8;  
                                        font-size:12px;  
                                    "  
                                >  
                                    No Image  
                                </div>  
                                `  
                            }  
  
                        </div>  
  
  
                        <div class="property-details">  
  
                            <h3>  
                                ${escapeHTML(title)}  
                            </h3>  
  
                            <p>  
                                📍  
                                ${escapeHTML(location)}  
                            </p>  
  
                            <p>  
                                🏠  
                                ${escapeHTML(type)}  
                            </p>  
  
                            <p>  
                                💰  
                                ${escapeHTML(  
                                    property.price ||  
                                    "Price on request"  
                                )}  
                            </p>  
  
  
                            <div class="badges">  
  
                                <span  
                                    class="badge ${statusClass}"  
                                >  
                                    ${escapeHTML(status)}  
                                </span>  
  
                                <span class="badge">  
                                    ${  
                                        purpose === "rent"  
                                        ? "For Rent"  
                                        : "For Sale"  
                                    }  
                                </span>  
  
                                ${  
                                    property.featured  
                                    ?  
                                    `  
                                    <span class="badge featured">  
                                        Featured  
                                    </span>  
                                    `  
                                    :  
                                    ""  
                                }  
  
                            </div>  
  
  
                            <div class="property-actions">  
  
                                <button  
                                    type="button"  
                                    class="edit-button"  
                                    data-edit-id="${escapeHTML(property.id)}"  
                                >  
                                    Edit  
                                </button>  
  
                                <button  
                                    type="button"  
                                    class="delete-button"  
                                    data-delete-id="${escapeHTML(property.id)}"  
                                >  
                                    Delete  
                                </button>  
  
                            </div>  
  
                        </div>  
  
                    </div>  
  
                </article>  
  
                `;  
  
            }  
        ).join("");  
  
  
    /* EDIT BUTTONS */  
  
    document  
        .querySelectorAll(  
            "[data-edit-id]"  
        )  
        .forEach(  
            button => {  
  
                button.addEventListener(  
                    "click",  
                    () => {  
  
                        editProperty(  
                            button.dataset.editId  
                        );  
  
                    }  
                );  
  
            }  
        );  
  
  
    /* DELETE BUTTONS */  
  
    document  
        .querySelectorAll(  
            "[data-delete-id]"  
        )  
        .forEach(  
            button => {  
  
                button.addEventListener(  
                    "click",  
                    () => {  
  
                        deleteProperty(  
                            button.dataset.deleteId  
                        );  
  
                    }  
                );  
  
            }  
        );  
  
}  
  
  
/* =========================================================  
   DELETE PROPERTY  
========================================================= */  
  
async function deleteProperty(  
    id  
) {  
  
    const property =  
        allProperties.find(  
            item =>  
                item.id === id  
        );  
  
  
    const title =  
        property?.title ||  
        "this property";  
  
  
    if (  
        !window.confirm(  
            "Delete " +  
            title +  
            "?"  
        )  
    ) {  
  
        return;  
    }  
  
  
    try {  
  
        await deleteDoc(  
            doc(  
                db,  
                COMPANIES_COLLECTION,  
                currentCompanyId,  
                PROPERTIES_SUBCOLLECTION,  
                id  
            )  
        );  
  
  
        if (  
            editingPropertyId === id  
        ) {  
  
            resetPropertyForm();  
  
        }  
  
  
        showMessage(  
            "dashboardMessage",  
            "Property deleted successfully.",  
            "success"  
        );  
  
  
        await loadProperties();  
  
    }  
  
    catch (error) {  
  
        console.error(  
            "Delete property:",  
            error  
        );  
  
        showMessage(  
            "dashboardMessage",  
            firebaseError(error),  
            "error"  
        );  
  
    }  
  
}  
  
  
/* =========================================================  
   SEARCH  
========================================================= */  
  
propertySearch.addEventListener(  
    "input",  
    event => {  
  
        const query =  
            event.target.value  
                .trim()  
                .toLowerCase();  
  
  
        if (!query) {  
  
            renderProperties(  
                allProperties  
            );  
  
            return;  
        }  
  
  
        const filtered =  
            allProperties.filter(  
                property => {  
  
                    const text =  
                        [  
                            property.title,  
                            property.propertyType,  
                            property.type,  
                            property.location,  
                            property.price,  
                            property.status,  
                            property.purpose,  
                            property.description  
                        ]  
                        .join(" ")  
                        .toLowerCase();  
  
  
                    return text.includes(  
                        query  
                    );  
  
                }  
            );  
  
  
        renderProperties(  
            filtered  
        );  
  
    }  
);  
  
  
/* =========================================================  
   STATS  
========================================================= */  
  
function updateStats() {  
  
    const total =  
        allProperties.length;  
  
  
    const available =  
        allProperties.filter(  
            property =>  
                String(  
                    property.status ||  
                    ""  
                ).toLowerCase() ===  
                "available"  
        ).length;  
  
  
    const sold =  
        allProperties.filter(  
            property =>  
                String(  
                    property.status ||  
                    ""  
                ).toLowerCase() ===  
                "sold"  
        ).length;  
  
  
    const rented =  
        allProperties.filter(  
            property =>  
                String(  
                    property.status ||  
                    ""  
                ).toLowerCase() ===  
                "rented"  
        ).length;  
  
  
    document.getElementById(  
        "totalProperties"  
    ).textContent =  
        total;  
  
  
    document.getElementById(  
        "availableProperties"  
    ).textContent =  
        available;  
  
  
    document.getElementById(  
        "soldProperties"  
    ).textContent =  
        sold;  
  
  
    document.getElementById(  
        "rentedProperties"  
    ).textContent =  
        rented;  
  
}  
  
  
/* =========================================================  
   REFRESH  
========================================================= */  
  
refreshButton.addEventListener(  
    "click",  
    async () => {  
  
        refreshButton.disabled =  
            true;  
  
        refreshButton.textContent =  
            "Refreshing...";  
  
  
        try {  
  
            await loadAdminProfile(  
                currentUser  
            );  
  
            await loadCompanySettings();  
  
            await loadProperties();  
  
        }  
  
        catch (error) {  
  
            console.error(  
                "Refresh:",  
                error  
            );  
  
            showMessage(  
                "dashboardMessage",  
                firebaseError(error),  
                "error"  
            );  
  
        }  
  
        finally {  
  
            refreshButton.disabled =  
                false;  
  
            refreshButton.textContent =  
                "Refresh";  
  
        }  
  
    }  
);  
  
  
/* =========================================================  
   DEBUG  
========================================================= */  
  
window.estatePro = {  
  
    auth,  
  
    db,  
  
    getCurrentUser:  
        () => currentUser,  
  
    getCurrentCompanyId:  
        () => currentCompanyId,  
  
    loadProperties,  
  
    loadCompanySettings,  
  
    editProperty  
  
};
