<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Dashboard | EstatePro</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:"Inter",sans-serif;
    background:#f5f7f9;
    color:#17202a;
}

/* =========================
   LOGIN
========================= */

#loginScreen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:#f5f7f9;
}

.login-card{
    width:100%;
    max-width:420px;
    background:#fff;
    padding:30px;
    border-radius:16px;
    box-shadow:0 8px 30px rgba(0,0,0,.08);
}

.login-logo{
    width:55px;
    height:55px;
    margin:0 auto 15px;
    border-radius:14px;
    background:#0f766e;
    color:#fff;
    display:grid;
    place-items:center;
    font-size:28px;
    font-weight:800;
}

.login-card h1{
    text-align:center;
    margin:0 0 8px;
}

.login-card > p{
    text-align:center;
    color:#64748b;
    margin:0 0 25px;
}

.login-card button{
    width:100%;
    border:0;
    background:#0f766e;
    color:#fff;
    padding:13px;
    border-radius:8px;
    cursor:pointer;
    font-weight:700;
}

.login-error{
    display:none;
    padding:11px;
    margin-bottom:15px;
    border-radius:8px;
    background:#fee2e2;
    color:#991b1b;
    font-size:14px;
}

.login-error.show{
    display:block;
}

/* =========================
   HEADER
========================= */

.admin-header{
    background:#0f766e;
    color:#fff;
    padding:18px 20px;
    position:sticky;
    top:0;
    z-index:100;
}

.admin-header-inner{
    max-width:1200px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.admin-brand{
    display:flex;
    align-items:center;
    gap:10px;
    font-weight:800;
    font-size:20px;
}

.admin-logo{
    width:42px;
    height:42px;
    border-radius:10px;
    background:#fff;
    color:#0f766e;
    display:grid;
    place-items:center;
    font-weight:800;
    font-size:22px;
}

.admin-header button{
    border:1px solid rgba(255,255,255,.4);
    background:transparent;
    color:#fff;
    padding:10px 15px;
    border-radius:8px;
    cursor:pointer;
}

/* =========================
   CONTAINER
========================= */

.admin-container{
    max-width:1200px;
    margin:auto;
    padding:25px 15px 50px;
}

.admin-title{
    margin-bottom:25px;
}

.admin-title h1{
    margin:0 0 7px;
    font-size:28px;
}

.admin-title p{
    margin:0;
    color:#64748b;
}

/* =========================
   STATS
========================= */

.stats-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
    margin-bottom:25px;
}

.stat-card{
    background:#fff;
    border-radius:14px;
    padding:20px;
    box-shadow:0 4px 18px rgba(0,0,0,.06);
}

.stat-card span{
    color:#64748b;
    font-size:13px;
}

.stat-card strong{
    display:block;
    margin-top:8px;
    font-size:28px;
}

/* =========================
   ADMIN GRID
========================= */

.admin-grid{
    display:grid;
    grid-template-columns:1fr 1.5fr;
    gap:20px;
}

.admin-card{
    background:#fff;
    border-radius:14px;
    padding:22px;
    box-shadow:0 4px 18px rgba(0,0,0,.06);
    margin-bottom:20px;
}

.admin-card h2{
    margin-top:0;
    margin-bottom:18px;
    font-size:20px;
}

/* =========================
   FORM
========================= */

.form-group{
    margin-bottom:14px;
}

.form-group label{
    display:block;
    font-size:13px;
    font-weight:600;
    margin-bottom:6px;
}

.form-group input,
.form-group select,
.form-group textarea{
    width:100%;
    padding:11px 12px;
    border:1px solid #d7dde3;
    border-radius:8px;
    outline:none;
    font:inherit;
    background:#fff;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus{
    border-color:#0f766e;
}

.form-group textarea{
    min-height:100px;
    resize:vertical;
}

.form-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.checkbox-row{
    display:flex;
    align-items:center;
    gap:8px;
    margin:15px 0;
}

.checkbox-row input{
    width:auto;
}

.primary-button{
    width:100%;
    border:none;
    background:#0f766e;
    color:#fff;
    padding:13px 18px;
    border-radius:8px;
    cursor:pointer;
    font-weight:700;
}

.primary-button:hover{
    opacity:.92;
}

.secondary-button{
    border:1px solid #d7dde3;
    background:#fff;
    color:#17202a;
    padding:9px 13px;
    border-radius:7px;
    cursor:pointer;
}

.danger-button{
    border:none;
    background:#dc2626;
    color:#fff;
    padding:9px 13px;
    border-radius:7px;
    cursor:pointer;
}

/* =========================
   COMPANY SETTINGS
========================= */

.company-settings{
    margin-top:20px;
}

.company-logo-preview{
    width:100%;
    max-width:180px;
    height:100px;
    border:1px dashed #cbd5e1;
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    background:#f8fafc;
    margin-top:8px;
}

.company-logo-preview img{
    width:100%;
    height:100%;
    object-fit:contain;
}

.company-logo-placeholder{
    color:#94a3b8;
    font-size:13px;
    text-align:center;
    padding:10px;
}

/* =========================
   PROPERTIES
========================= */

.properties-toolbar{
    display:flex;
    gap:10px;
    margin-bottom:15px;
}

.properties-toolbar input{
    flex:1;
    padding:11px 12px;
    border:1px solid #d7dde3;
    border-radius:8px;
}

.admin-property{
    border:1px solid #e2e8f0;
    border-radius:10px;
    padding:15px;
    margin-bottom:12px;
}

.admin-property-top{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:10px;
}

.admin-property h3{
    margin:0 0 5px;
    font-size:17px;
}

.admin-property p{
    margin:4px 0;
    color:#64748b;
    font-size:13px;
}

.admin-actions{
    display:flex;
    gap:7px;
    flex-wrap:wrap;
    margin-top:12px;
}

/* =========================
   MESSAGES
========================= */

.message{
    display:none;
    padding:12px;
    border-radius:8px;
    margin-bottom:15px;
    font-size:14px;
}

.message.show{
    display:block;
}

.message.success{
    background:#dcfce7;
    color:#166534;
}

.message.error{
    background:#fee2e2;
    color:#991b1b;
}

.loading{
    text-align:center;
    padding:25px;
    color:#64748b;
}

.empty{
    text-align:center;
    padding:25px;
    color:#64748b;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:900px){

    .stats-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .admin-grid{
        grid-template-columns:1fr;
    }
}

@media(max-width:600px){

    .stats-grid{
        grid-template-columns:1fr 1fr;
    }

    .form-row{
        grid-template-columns:1fr;
    }

    .admin-header-inner{
        align-items:flex-start;
    }

    .admin-property-top{
        flex-direction:column;
    }
}
</style>
</head>

<script type="module">

import {
    initializeApp,
    getApps
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
    getAuth,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
    getFirestore,
    collection,
    getDocs,
    addDoc,
    updateDoc,
    deleteDoc,
    doc,
    setDoc,
    getDoc,
    serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyAE44DxNnqz3m8ScqaZxoSj2FdQ7aJ2NIg",

    authDomain:
        "estate-pro-d564b.firebaseapp.com",

    projectId:
        "estate-pro-d564b",

    storageBucket:
        "estate-pro-d564b.firebasestorage.app",

    messagingSenderId:
        "600309829118",

    appId:
        "1:600309829118:web:60c61624ca8cdf05e884af",

    measurementId:
        "G-TG60FCJHXB"

};


/* =====================================================
   FIREBASE
===================================================== */

const app =
    getApps().length
        ? getApps()[0]
        : initializeApp(firebaseConfig);

const db =
    getFirestore(app);

const auth =
    getAuth(app);


/* =====================================================
   COLLECTIONS
===================================================== */

const propertiesRef =
    collection(
        db,
        "Properties"
    );


const companySettingsRef =
    doc(
        db,
        "CompanySettings",
        "main"
    );


/* =====================================================
   STATE
===================================================== */

let properties = [];


/* =====================================================
   HELPERS
===================================================== */

function $(id){

    return document.getElementById(id);

}


function showMessage(
    text,
    type = "success"
){

    const message =
        $("message");

    if(!message) return;

    message.textContent =
        text;

    message.className =
        `message show ${type}`;

    setTimeout(() => {

        message.className =
            "message";

    },3500);

}


function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function getNumber(value){

    const number =
        Number(value);

    return Number.isFinite(number)
        ? number
        : 0;

}


/* =====================================================
   COMPANY SETTINGS
===================================================== */

async function loadCompanySettings(){

    try{

        const snapshot =
            await getDoc(
                companySettingsRef
            );

        if(!snapshot.exists()){

            return;

        }

        const data =
            snapshot.data();

        $("companyName").value =
            data.companyName || "";

        $("companyLogo").value =
            data.companyLogo || "";

        $("companyEmail").value =
            data.companyEmail || "";

        $("companyPhone").value =
            data.companyPhone || "";

        $("companyWhatsApp").value =
            data.companyWhatsApp || "";

        $("companyAddress").value =
            data.companyAddress || "";

        $("companyDescription").value =
            data.companyDescription || "";

        $("instagram").value =
            data.instagram || "";

        $("facebook").value =
            data.facebook || "";

        $("twitter").value =
            data.twitter || "";

        $("website").value =
            data.website || "";

        updateLogoPreview(
            data.companyLogo || ""
        );

    }catch(error){

        console.error(
            "Company settings load error:",
            error
        );

        showMessage(
            "Could not load company settings.",
            "error"
        );

    }

}


/* =====================================================
   LOGO PREVIEW
===================================================== */

function updateLogoPreview(url){

    const preview =
        $("companyLogoPreview");

    if(!preview) return;

    if(!url){

        preview.innerHTML = `
            <div class="company-logo-placeholder">
                Logo preview
            </div>
        `;

        return;

    }

    preview.innerHTML = `
        <img
            src="${escapeHTML(url)}"
            alt="Company Logo"
            onerror="this.parentElement.innerHTML='<div class=&quot;company-logo-placeholder&quot;>Invalid image URL</div>'"
        >
    `;

}


$("companyLogo").addEventListener(
    "input",
    event => {

        updateLogoPreview(
            event.target.value.trim()
        );

    }
);


/* =====================================================
   SAVE COMPANY SETTINGS
===================================================== */

$("companySettingsForm")
.addEventListener(
    "submit",
    async event => {

        event.preventDefault();

        const button =
            $("saveCompanyButton");

        button.disabled =
            true;

        button.textContent =
            "Saving...";

        const companyData = {

            companyName:
                $("companyName")
                .value
                .trim(),

            companyLogo:
                $("companyLogo")
                .value
                .trim(),

            companyEmail:
                $("companyEmail")
                .value
                .trim(),

            companyPhone:
                $("companyPhone")
                .value
                .trim(),

            companyWhatsApp:
                $("companyWhatsApp")
                .value
                .trim(),

            companyAddress:
                $("companyAddress")
                .value
                .trim(),

            companyDescription:
                $("companyDescription")
                .value
                .trim(),

            instagram:
                $("instagram")
                .value
                .trim(),

            facebook:
                $("facebook")
                .value
                .trim(),

            twitter:
                $("twitter")
                .value
                .trim(),

            website:
                $("website")
                .value
                .trim(),

            updatedAt:
                serverTimestamp()

        };


        try{

            await setDoc(
                companySettingsRef,
                companyData,
                {
                    merge:true
                }
            );

            showMessage(
                "Company settings saved successfully."
            );

        }catch(error){

            console.error(
                "Company settings save error:",
                error
            );

            showMessage(
                "Could not save company settings. Check Firebase Rules.",
                "error"
            );

        }finally{

            button.disabled =
                false;

            button.textContent =
                "Save Company Settings";

        }

    }
);


/* =====================================================
   LOAD PROPERTIES
===================================================== */

async function loadProperties(){

    const list =
        $("propertiesList");

    list.innerHTML = `
        <div class="loading">
            Loading properties...
        </div>
    `;

    try{

        const snapshot =
            await getDocs(
                propertiesRef
            );

        properties =
            snapshot.docs.map(
                item => ({

                    id:item.id,
                    ...item.data()

                })
            );

        renderProperties(
            properties
        );

        updateStats();

    }catch(error){

        console.error(
            "Failed to load properties:",
            error
        );

        list.innerHTML = `
            <div class="empty">
                Unable to load properties.
            </div>
        `;

        showMessage(
            "Could not load Properties from Firebase.",
            "error"
        );

    }

}


/* =====================================================
   RENDER PROPERTIES
===================================================== */

function renderProperties(data){

    const list =
        $("propertiesList");

    if(!data.length){

        list.innerHTML = `
            <div class="empty">
                No properties found.
            </div>
        `;

        return;

    }


    list.innerHTML =
        data.map(property => {

            const purpose =
                property.purpose || "sale";

            const price =
                property.price ??
                "Price on request";

            return `

                <div class="admin-property">

                    <div class="admin-property-top">

                        <div>

                            <h3>
                                ${escapeHTML(
                                    property.title ||
                                    "Untitled Property"
                                )}
                            </h3>

                            <p>
                                📍
                                ${escapeHTML(
                                    property.Location ||
                                    property.location ||
                                    "No location"
                                )}
                            </p>

                            <p>
                                💰
                                ₦${getNumber(price)
                                    .toLocaleString("en-NG")}
                            </p>

                            <p>
                                🏷️
                                ${escapeHTML(
                                    purpose
                                )}
                            </p>

                        </div>

                    </div>


                    <div class="admin-actions">

                        <button
                            type="button"
                            class="secondary-button"
                            data-edit="${escapeHTML(property.id)}"
                        >
                            Edit
                        </button>

                        <button
                            type="button"
                            class="danger-button"
                            data-delete="${escapeHTML(property.id)}"
                        >
                            Delete
                        </button>

                    </div>

                </div>

            `;

        }).join("");


    list
        .querySelectorAll("[data-edit]")
        .forEach(button => {

            button.addEventListener(
                "click",
                () => {

                    editProperty(
                        button.dataset.edit
                    );

                }
            );

        });


    list
        .querySelectorAll("[data-delete]")
        .forEach(button => {

            button.addEventListener(
                "click",
                () => {

                    deleteProperty(
                        button.dataset.delete
                    );

                }
            );

        });

}


/* =====================================================
   STATS
===================================================== */

function updateStats(){

    $("totalProperties")
        .textContent =
        properties.length;


    $("saleProperties")
        .textContent =
        properties.filter(
            item =>
                String(
                    item.purpose || ""
                ).toLowerCase() === "sale"
        ).length;


    $("rentProperties")
        .textContent =
        properties.filter(
            item =>
                String(
                    item.purpose || ""
                ).toLowerCase() === "rent"
        ).length;


    $("featuredProperties")
        .textContent =
        properties.filter(
            item =>
                item.featured === true
        ).length;

}


/* =====================================================
   ADD / UPDATE PROPERTY
===================================================== */

$("propertyForm")
.addEventListener(
    "submit",
    async event => {

        event.preventDefault();

        const editingId =
            $("editingId")
            .value
            .trim();

        const propertyData = {

            title:
                $("title")
                .value
                .trim(),

            Location:
                $("location")
                .value
                .trim(),

            price:
                getNumber(
                    $("price").value
                ),

            purpose:
                $("purpose").value,

            propertyType:
                $("propertyType").value,

            status:
                $("status").value,

            bedrooms:
                getNumber(
                    $("bedrooms").value
                ),

            bathrooms:
                getNumber(
                    $("bathrooms").value
                ),

            area:
                $("area")
                .value
                .trim(),

            description:
                $("description")
                .value
                .trim(),

            imageUrl:
                $("imageUrl")
                .value
                .trim(),

            featured:
                $("featured")
                .checked,

            updatedAt:
                serverTimestamp()

        };


        const button =
            $("savePropertyButton");

        button.disabled =
            true;

        button.textContent =
            editingId
                ? "Updating..."
                : "Saving...";


        try{

            if(editingId){

                await updateDoc(

                    doc(
                        db,
                        "Properties",
                        editingId
                    ),

                    propertyData

                );

                showMessage(
                    "Property updated successfully."
                );

            }else{

                await addDoc(

                    propertiesRef,

                    {

                        ...propertyData,

                        createdAt:
                            serverTimestamp()

                    }

                );

                showMessage(
                    "Property added successfully."
                );

            }


            resetForm();

            await loadProperties();

        }catch(error){

            console.error(
                "Save error:",
                error
            );

            showMessage(
                "Could not save property. Check Firebase Rules.",
                "error"
            );

        }finally{

            button.disabled =
                false;

            button.textContent =
                "Add Property";

        }

    }
);


/* =====================================================
   EDIT PROPERTY
===================================================== */

function editProperty(id){

    const property =
        properties.find(
            item =>
                item.id === id
        );

    if(!property){
        return;
    }


    $("editingId").value =
        property.id;

    $("title").value =
        property.title || "";

    $("location").value =
        property.location ||
        property.location ||
        "";

    $("price").value =
        property.price || "";

    $("purpose").value =
        property.purpose || "sale";

    $("propertyType").value =
        property.propertyType || "house";

    $("status").value =
        property.status || "available";

    $("bedrooms").value =
        property.bedrooms || "";

    $("bathrooms").value =
        property.bathrooms || "";

    $("area").value =
        property.area || "";

    $("description").value =
        property.description || "";

    $("imageUrl").value =
        property.imageUrl || "";

    $("featured").checked =
        property.featured === true;

    $("formTitle").textContent =
        "Edit Property";

    $("savePropertyButton").textContent =
        "Update Property";

    $("cancelEditButton")
        .style.display =
        "block";

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* =====================================================
   DELETE PROPERTY
===================================================== */

async function deleteProperty(id){

    const property =
        properties.find(
            item =>
                item.id === id
        );

    if(!property){
        return;
    }


    const confirmed =
        confirm(
            `Delete "${
                property.title ||
                "this property"
            }"?`
        );

    if(!confirmed){
        return;
    }


    try{

        await deleteDoc(

            doc(
                db,
                "Properties",
                id
            )

        );

        showMessage(
            "Property deleted successfully."
        );

        await loadProperties();

    }catch(error){

        console.error(
            "Delete error:",
            error
        );

        showMessage(
            "Could not delete property.",
            "error"
        );

    }

}


/* =====================================================
   RESET PROPERTY FORM
===================================================== */

function resetForm(){

    $("propertyForm").reset();

    $("editingId").value =
        "";

    $("formTitle").textContent =
        "Add Property";

    $("savePropertyButton").textContent =
        "Add Property";

    $("cancelEditButton")
        .style.display =
        "none";

    $("purpose").value =
        "sale";

    $("propertyType").value =
        "house";

    $("status").value =
        "available";

}


$("cancelEditButton")
.addEventListener(
    "click",
    resetForm
);


/* =====================================================
   SEARCH
===================================================== */

$("propertySearch")
.addEventListener(
    "input",
    event => {

        const search =
            event.target.value
            .trim()
            .toLowerCase();

        if(!search){

            renderProperties(
                properties
            );

            return;

        }


        const filtered =
            properties.filter(
                property => {

                    const text = [

                        property.title,

                        property.Location,

                        property.location,

                        property.propertyType,

                        property.purpose,

                        property.status

                    ]
                    .join(" ")
                    .toLowerCase();

                    return text.includes(
                        search
                    );

                }
            );


        renderProperties(
            filtered
        );

    }
);

    }

/* =====================================================
   AUTHENTICATION
===================================================== */

const loginScreen =
    $("loginScreen");

const adminDashboard =
    $("adminDashboard");

const loginForm =
    $("loginForm");

const loginButton =
    $("loginButton");

const loginError =
    $("loginError");

const logoutButton =
    $("logoutButton");


function showLoginError(message){

    loginError.textContent =
        message;

    loginError.className =
        "login-error show";

}


loginForm.addEventListener(
    "submit",
    async event => {

        event.preventDefault();

        const email =
            $("adminEmail")
            .value
            .trim();

        const password =
            $("adminPassword")
            .value;

        loginError.className =
            "login-error";

        loginButton.disabled =
            true;

        loginButton.textContent =
            "Signing in...";


        try{

            await signInWithEmailAndPassword(
                auth,
                email,
                password
            );

        }catch(error){

            console.error(
                "Login error:",
                error
            );

            let message =
                "Login failed. Check your email and password.";


            if(
                error.code ===
                "auth/invalid-credential"
            ){

                message =
                    "Incorrect email or password.";

            }


            if(
                error.code ===
                "auth/too-many-requests"
            ){

                message =
                    "Too many login attempts. Please try again later.";

            }


            if(
                error.code ===
                "auth/invalid-email"
            ){

                message =
                    "Please enter a valid email address.";

            }


            showLoginError(
                message
            );

        }finally{

            loginButton.disabled =
                false;

            loginButton.textContent =
                "Login";

        }

    }
);


/* =====================================================
   AUTH STATE
===================================================== */

onAuthStateChanged(
    auth,
    user => {

        if(user){

            loginScreen.style.display =
                "none";

            adminDashboard.style.display =
                "block";

            loadProperties();

            loadCompanySettings();

        }else{

            loginScreen.style.display =
                "flex";

            adminDashboard.style.display =
                "none";

        }

    }
);


/* =====================================================
   LOGOUT
===================================================== */

logoutButton.addEventListener(
    "click",
    async () => {

        try{

            await signOut(auth);

        }catch(error){

            console.error(
                "Logout error:",
                error
            );

            showMessage(
                "Could not logout.",
                "error"
            );

        }

    }
);
