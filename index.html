
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>EstatePro</title>

</head>

<body>

    <div id="companyInfo">

    <h1 id="companyName">
        Loading...
    </h1>

    <img
        id="companyLogo"
        src=""
        alt="Company Logo"
        style="display:none; width:120px;"
    >

    <p id="companyPhone"></p>

    <p id="companyWhatsApp"></p>

    <p id="companyEmail"></p>

    <p id="companyAddress"></p>

    <p id="companyDescription"></p>

</div>


    <script type="module">

        import {
            initializeApp
        } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

        import {
            getFirestore,
            doc,
            getDoc
        } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


        /* ===============================
           FIREBASE CONFIG
        =============================== */

        const firebaseConfig = {

            apiKey:
                "AIzaSyAE44DxNnqz3m8ScqaZxoSj2FdQ7aJ2NIg",

            authDomain:
                "estate-pro-d564b.firebaseapp.com",

            projectId:
                "estate-pro-d564b",

            storageBucket:
                "estate-pro-d564b.firebasestorage.app",

            messagingSenderId:
                "600309829118",

            appId:
                "1:600309829118:web:60c61624ca8cdf05e884af",

            measurementId:
                "G-TG60FCJHXB"
        };


        /* ===============================
           FIREBASE
        =============================== */

        const app =
            initializeApp(firebaseConfig);

        const db =
            getFirestore(app);


        /* ===============================
           GET COMPANY ID FROM URL
           
           Example:
           index.html?company=Company_001
           index.html?company=Company_002
        =============================== */

        const params =
            new URLSearchParams(
                window.location.search
            );

        const companyId =
            params.get("company");


        /* ===============================
           CHECK COMPANY ID
        =============================== */

        if (!companyId) {

            document.getElementById(
                "companyName"
            ).textContent =
                "Company ID is missing.";

        }


        /* ===============================
           LOAD COMPANY
        =============================== */

        async function loadCompany() {

            try {

                if (!companyId) {
                    return;
                }


                const companyRef =
                    doc(
                        db,
                        "companies",
                        companyId
                    );


                const snapshot =
                    await getDoc(
                        companyRef
                    );


                if (!snapshot.exists()) {

                    document.getElementById(
                        "companyName"
                    ).textContent =
                        "Company not found.";

                    return;
                }


                const company =
                    snapshot.data();

    document.getElementById(
    "companyName"
).textContent =
    company.name || "EstatePro";


/* COMPANY LOGO */

const logo =
    company.logo ||
    company.companyLogo ||
    "";

const logoElement =
    document.getElementById(
        "companyLogo"
    );

if (logo) {

    logoElement.src =
        logo;

    logoElement.style.display =
        "block";

}


/* COMPANY PHONE */

document.getElementById(
    "companyPhone"
).textContent =
    company.phone
        ? "Phone: " + company.phone
        : "";


/* COMPANY WHATSAPP */

document.getElementById(
    "companyWhatsApp"
).textContent =
    company.whatsapp
        ? "WhatsApp: " + company.whatsapp
        : "";


/* COMPANY EMAIL */

document.getElementById(
    "companyEmail"
).textContent =
    company.email
        ? "Email: " + company.email
        : "";


/* COMPANY ADDRESS */

document.getElementById(
    "companyAddress"
).textContent =
    company.address
        ? "Address: " + company.address
        : "";


/* COMPANY DESCRIPTION */

document.getElementById(
    "companyDescription"
).textContent =
    company.description
        ? company.description
        : "";
                


                console.log(
                    "EstatePro company loaded:",
                    companyId
                );

            }


            catch (error) {

                console.error(
                    "Company loading error:",
                    error
                );

                alert(
                    "CODE: " +
                    (error?.code || "unknown") +
                    "\nMESSAGE: " +
                    (error?.message || "unknown")
                );


                document.getElementById(
                    "companyName"
                ).textContent =
                    "Error loading company.";

            }

        }


        /* ===============================
           START
        =============================== */

        loadCompany();

    </script>

</body>

</html>
