EstatePro — Multi-Company Index

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>EstatePro</title>

</head>

<body>

    <h1 id="companyName">
        Loading...
    </h1>


    <script type="module">

        import {
            initializeApp
        } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

        import {
            getFirestore,
            doc,
            getDoc
        } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


        /* ===============================
           FIREBASE CONFIG
        =============================== */

        const firebaseConfig = {

            apiKey:
                "AIzaSyAE44DxNnqz3m8ScqaZxoSj2FdQ7aJ2NIg",

            authDomain:
                "estate-pro-d564b.firebaseapp.com",

            projectId:
                "estate-pro-d564b",

            storageBucket:
                "estate-pro-d564b.firebasestorage.app",

            messagingSenderId:
                "600309829118",

            appId:
                "1:600309829118:web:60c61624ca8cdf05e884af",

            measurementId:
                "G-TG60FCJHXB"
        };


        /* ===============================
           FIREBASE
        =============================== */

        const app =
            initializeApp(firebaseConfig);

        const db =
            getFirestore(app);


        /* ===============================
           GET COMPANY ID FROM URL
           
           Example:
           index.html?company=Company_001
           index.html?company=Company_002
        =============================== */

        const params =
            new URLSearchParams(
                window.location.search
            );

        const companyId =
            params.get("company");


        /* ===============================
           CHECK COMPANY ID
        =============================== */

        if (!companyId) {

            document.getElementById(
                "companyName"
            ).textContent =
                "Company ID is missing.";

        }


        /* ===============================
           LOAD COMPANY
        =============================== */

        async function loadCompany() {

            try {

                if (!companyId) {
                    return;
                }


                const companyRef =
                    doc(
                        db,
                        "companies",
                        companyId
                    );


                const snapshot =
                    await getDoc(
                        companyRef
                    );


                if (!snapshot.exists()) {

                    document.getElementById(
                        "companyName"
                    ).textContent =
                        "Company not found.";

                    return;
                }


                const company =
                    snapshot.data();


                document.getElementById(
                    "companyName"
                ).textContent =
                    company.name ||
                    "EstatePro";


                console.log(
                    "EstatePro company loaded:",
                    companyId
                );

            }


            catch (error) {

                console.error(
                    "Company loading error:",
                    error
                );

                alert(
                    "CODE: " +
                    (error?.code || "unknown") +
                    "\nMESSAGE: " +
                    (error?.message || "unknown")
                );


                document.getElementById(
                    "companyName"
                ).textContent =
                    "Error loading company.";

            }

        }


        /* ===============================
           START
        =============================== */

        loadCompany();

    </script>

</body>

</html>
